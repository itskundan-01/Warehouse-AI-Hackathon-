apiVersion: apps/v1
kind: Deployment
metadata:
  name: warehousevision-worker
  labels:
    app: warehousevision
    component: worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: warehousevision
      component: worker
  template:
    metadata:
      labels:
        app: warehousevision
        component: worker
    spec:
      containers:
      - name: worker
        image: warehousevision/worker:latest
        imagePullPolicy: Always
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: warehousevision-secrets
              key: database-url
        - name: RABBITMQ_URL
          valueFrom:
            secretKeyRef:
              name: warehousevision-secrets
              key: rabbitmq-url
        - name: ENVIRONMENT
          value: "production"
        - name: LOG_LEVEL
          value: "INFO"
        resources:
          requests:
            memory: "1Gi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
        # Resource for ML models
        volumeMounts:
        - name: models-volume
          mountPath: /app/models
      volumes:
      - name: models-volume
        persistentVolumeClaim:
          claimName: models-pvc
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000