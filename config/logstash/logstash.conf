input {
  beats {
    port => 5044
    host => "0.0.0.0"
  }
  
  tcp {
    port => 5000
    codec => json
  }
  
  http {
    port => 8080
    codec => json
  }
}

filter {
  # Remove sensitive information
  if [message] =~ "password" or [message] =~ "secret" or [message] =~ "token" or [message] =~ "apikey" {
    mutate {
      replace => { "message" => "*** REDACTED SENSITIVE INFORMATION ***" }
    }
  }
  
  # Parse JSON
  if [headers][content_type] =~ "json" {
    json {
      source => "message"
    }
  }
  
  # Add timestamp
  date {
    match => ["timestamp", "yyyy-MM-dd'T'HH:mm:ss.SSSZ"]
    target => "@timestamp"
  }
  
  # Add environment information
  mutate {
    add_field => {
      "environment" => "${ENVIRONMENT:development}"
    }
  }
  
  # Categorize logs
  if [log_level] == "ERROR" or [log_level] == "CRITICAL" {
    mutate {
      add_tag => ["error"]
    }
  }
  
  # Parse user information for audit logs
  if [log_type] == "audit" {
    grok {
      match => { "message" => "User %{WORD:user_id} performed %{WORD:action} on %{WORD:resource_type} %{WORD:resource_id}" }
    }
  }
}

output {
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    user => "elastic"
    password => "${ELASTIC_PASSWORD}"
    index => "warehousevision-%{+YYYY.MM.dd}"
  }
  
  # Route security events to a separate index
  if "security" in [tags] {
    elasticsearch {
      hosts => ["elasticsearch:9200"]
      user => "elastic"
      password => "${ELASTIC_PASSWORD}"
      index => "warehousevision-security-%{+YYYY.MM.dd}"
    }
  }
  
  # Route error logs to a separate index
  if "error" in [tags] {
    elasticsearch {
      hosts => ["elasticsearch:9200"]
      user => "elastic"
      password => "${ELASTIC_PASSWORD}"
      index => "warehousevision-errors-%{+YYYY.MM.dd}"
    }
  }
  
  # Debug output to console during development
  if "${ENVIRONMENT}" == "development" {
    stdout {
      codec => rubydebug
    }
  }
}
